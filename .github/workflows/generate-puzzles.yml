name: Generate upcoming puzzles
# Every Monday: freeze the next 21 days of puzzles that do not exist yet and open a pull request.
# A human reviews the pull request before the puzzles go live.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: npm test
      - name: Freeze the next 21 days
        run: npm run generate:ahead
      - name: Check every puzzle file against the rules
        run: npm run lint:data
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upcoming-puzzles
          commit-message: "Add upcoming puzzles"
          title: "Add upcoming puzzles"
          body: |
            New frozen puzzle files for the next 21 days.

            Before merging, open a few of the files in `puzzles/` and check that the questions read well and the facts look right. The data linter already passed in this run.
          delete-branch: true
