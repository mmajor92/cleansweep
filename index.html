<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clean Sweep</title>
<meta name="description" content="A daily sweep of higher or lower questions. Can you get a clean sweep?">
<script>try{var t=localStorage.getItem("cleansweep:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Clean Sweep</h1>
    <div class="topright">
      <button class="theme" id="theme" type="button" aria-label="Switch theme"></button>
      <span class="proto" id="meta"></span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chainbox"><div class="chain" id="chain"></div><div class="caps" id="caps"></div></div>
  <div class="card" id="card" aria-live="polite"></div>
  <p class="ver" id="ver"></p>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
